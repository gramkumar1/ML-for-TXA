[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "airtd"
version = "0.1.0"
description = "Task-trained dictionary denoising for XUV transient-absorption spectroscopy"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.8",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "gdown>=4.7",
]

[tool.setuptools]
packages = ["airtd"]
